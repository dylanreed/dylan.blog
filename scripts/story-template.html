<!-- ABOUTME: HTML template for generating 1080x1920 Instagram Story frames for blog posts. -->
<!-- ABOUTME: Vertical sibling of instagram-template.html; reserves the bottom ~600px as a link-sticker safe zone. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'MedievalSharp', cursive;
    }

    #background {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background-size: cover;
      background-position: center;
      image-rendering: pixelated;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: rgba(0, 0, 0, 0.55);
    }

    #accent {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 8px;
    }

    /* Text sits in the top region; the bottom 600px stays clear for the link sticker. */
    #title-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1320px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 80px;
    }

    #title {
      color: #f5e6d3;
      text-align: center;
      max-width: 920px;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
      line-height: 1.3;
      font-family: 'MedievalSharp', cursive;
      font-weight: normal;
    }

    #title.size-xl { font-size: 84px; }
    #title.size-lg { font-size: 68px; }
    #title.size-md { font-size: 56px; }
    #title.size-sm { font-size: 44px; }

    #sprite {
      position: absolute;
      bottom: 640px;
      left: 60px;
      width: 110px;
      height: 110px;
      background-size: 200% 200%;
      background-position: 0 0;
      image-rendering: pixelated;
    }

    #branding {
      position: absolute;
      bottom: 660px;
      left: 0;
      width: 1080px;
      text-align: center;
      font-family: 'Uncial Antiqua', cursive;
      font-size: 34px;
      color: rgba(245, 230, 211, 0.7);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div id="overlay"></div>
  <div id="accent"></div>
  <div id="title-container">
    <h1 id="title" class="size-xl"></h1>
  </div>
  <div id="sprite"></div>
  <div id="branding">dylan's blog</div>
</body>
</html>
