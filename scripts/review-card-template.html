<!-- ABOUTME: Puppeteer template for the 1080x1080 book review card — banded layout, skinned by the book's genre. -->
<!-- ABOUTME: Values are injected by generate-instagram.js --review from the post's `book:` frontmatter block. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<link id="webfonts" href="" rel="stylesheet">
<style>
  :root{
    --accent:#8060c0; --accent-dim:#3a2a5c; --well:#0d0a12;
    --bg-a:#241a33; --bg-b:#140f1c;
    --display:'MedievalSharp'; --body:'Spectral'; --ui:'VT323';
    --talker:54px;
    --parchment:#f5e6d3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1080px;overflow:hidden;
    background:linear-gradient(160deg,var(--bg-a) 0%,var(--bg-b) 100%);
    color:var(--parchment);font-family:var(--body),Georgia,serif;
    display:flex;flex-direction:column;position:relative;
  }
  img{image-rendering:pixelated}

  #accent{position:absolute;top:0;left:0;right:0;height:10px;background:var(--accent);z-index:3}

  /* ---- header art ---- */
  #hdr-wrap{position:relative;flex-shrink:0;height:152px}
  #hdr{width:100%;height:152px;object-fit:cover;object-position:center;opacity:.85;display:block}
  #hdr-wrap::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,transparent 40%,var(--bg-a));
  }

  /* ---- band 1: identity ---- */
  #band-id{
    display:flex;gap:30px;align-items:center;
    padding:32px 56px;border-bottom:2px solid var(--accent-dim);
  }
  #cover{
    width:132px;aspect-ratio:2/3;flex-shrink:0;object-fit:cover;
    border:3px solid rgba(245,230,211,.34);
    image-rendering:auto;                 /* a real cover is not pixel art */
    background:linear-gradient(150deg,#5b4a7b,#2a1f3d);
  }
  #cover[data-empty="true"]{display:none}
  #title{font-family:var(--display),cursive;font-size:58px;font-weight:400;line-height:1.08}
  #byline{font-family:var(--body),serif;font-size:28px;opacity:.6;margin-top:8px}

  /* ---- band 2: hero ---- */
  #band-hero{flex:1;display:flex;align-items:center;padding:32px 56px;min-height:0}
  #talker{
    font-family:var(--body),serif;font-size:var(--talker);line-height:1.32;
    font-style:italic;border-left:8px solid var(--accent);padding-left:30px;display:block;
  }

  /* ---- band 3: verdict ---- */
  #band-verdict{
    padding:28px 56px 40px;border-top:2px solid var(--accent-dim);
    background:rgba(0,0,0,.26);display:flex;flex-direction:column;gap:18px;
  }
  #verdict-top{display:flex;align-items:center;gap:24px}
  #sprite{
    --f:92px;
    width:var(--f);height:var(--f);flex-shrink:0;
    background-size:calc(var(--f) * 6) calc(var(--f) * 3);
    background-position:0 0;background-repeat:no-repeat;
    image-rendering:pixelated;
    filter:drop-shadow(0 0 16px var(--accent));
  }
  #sprite[data-empty="true"]{display:none}
  #shelf{
    font-family:var(--ui),monospace;letter-spacing:6px;font-size:38px;
    border:4px solid var(--accent);color:var(--accent);padding:8px 24px;
  }
  #bar-row{display:flex;align-items:center;gap:22px}
  #bar-label{font-family:var(--display),cursive;font-size:34px;white-space:nowrap}
  #bar-track{flex:1;min-width:0;height:46px;background:var(--well);border:4px solid var(--accent-dim);padding:5px}
  #bar-fill{
    display:block;height:100%;
    background-image:linear-gradient(45deg,var(--accent) 25%,transparent 25%,transparent 50%,
      var(--accent) 50%,var(--accent) 75%,transparent 75%);
    background-size:34px 34px;background-color:var(--accent-dim);
  }
  #bar-state{font-family:var(--ui),monospace;font-size:24px;letter-spacing:2px;color:#7de2a3;white-space:nowrap}
  /* leave room for the wordmark in the bottom-right corner */
  #comps{font-family:var(--body),serif;font-size:28px;opacity:.78;padding-right:210px}
  #comps b{font-family:var(--ui),monospace;font-size:26px;letter-spacing:4px;opacity:.8;margin-right:14px}
  #comps[data-empty="true"]{display:none}


  /* ============================================================
     LAYOUT VARIANTS — body carries data-layout; banded is the base.
     Same palette, same type roles, same furniture. Only the arrangement
     changes: nothing here may alter the look, only where things sit.
     ============================================================ */

  /* ---- SPLIT: the cover becomes a full-height left column ---- */
  body[data-layout="split"] #cover{
    position:absolute;left:0;top:152px;bottom:0;
    width:344px;height:auto;aspect-ratio:auto;
    border:0;border-right:3px solid var(--accent-dim);
    object-fit:cover;z-index:2;
  }
  body[data-layout="split"] #band-id,
  body[data-layout="split"] #band-hero{padding-left:400px}
  /* the cover ends at its natural height, so the verdict band runs full width */
  body[data-layout="split"] #title{font-size:52px}
  body[data-layout="split"] #talker{font-size:calc(var(--talker) * .86)}
  body[data-layout="split"] #comps{padding-right:190px}

  /* ---- STACKED: the talker leads, identity moves under it ---- */
  body[data-layout="stacked"] #band-hero{
    order:1;flex:0 0 auto;padding:38px 56px 30px;
    border-bottom:2px solid var(--accent-dim);
  }
  body[data-layout="stacked"] #band-id{
    order:2;flex:1;border-bottom:0;align-items:center;
  }
  body[data-layout="stacked"] #band-verdict{order:3}
  body[data-layout="stacked"] #title{font-size:50px}
  body[data-layout="stacked"] #cover{width:118px}

  #brand{
    position:absolute;bottom:20px;right:30px;
    font-family:'Uncial Antiqua',cursive;font-size:26px;opacity:.42;
  }
</style>
</head>
<body data-layout="banded">
  <div id="accent"></div>
  <div id="hdr-wrap"><img id="hdr" alt=""></div>

  <div id="band-id">
    <img id="cover" alt="">
    <div>
      <div id="title"></div>
      <div id="byline"></div>
    </div>
  </div>

  <div id="band-hero"><q id="talker"></q></div>

  <div id="band-verdict">
    <div id="verdict-top">
      <span id="sprite"></span>
      <span id="shelf"></span>
    </div>
    <div id="bar-row">
      <span id="bar-label">ENJOYMENT...</span>
      <span id="bar-track"><span id="bar-fill"></span></span>
      <span id="bar-state"></span>
    </div>
    <div id="comps"><b>READ IF YOU LIKED</b><span id="comps-text"></span></div>
  </div>

  <div id="brand">dylan's blog</div>
</body>
</html>
